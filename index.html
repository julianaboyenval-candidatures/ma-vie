<style>
/* Même univers que Mon Budget : une colonne de téléphone, onglets en bas, feuilles qui montent du bas. */
:root {
  --bg: #fcf4f7; --surface: #ffffff; --ink: #3a2630; --muted: #7a5c68; --line: #f1dfe6; --soft: #fbe9f1;
  --accent: #c93f7f; --on-accent: #ffffff;
  --good: #1b7f58; --warn: #a65f00; --bad: #c2302b;
  --font: "Nunito", ui-rounded, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #1f161b; --surface: #2a1f26; --ink: #f8ecf1; --muted: #c0a5b1; --line: #43323b; --soft: #3a2a32;
  --accent: #ee75a9; --on-accent: #2a1020;
  --good: #57c79a; --warn: #e6a94d; --bad: #f0807a;
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #1f161b; --surface: #2a1f26; --ink: #f8ecf1; --muted: #c0a5b1; --line: #43323b; --soft: #3a2a32;
  --accent: #ee75a9; --on-accent: #2a1020;
  --good: #57c79a; --warn: #e6a94d; --bad: #f0807a;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 16px; line-height: 1.4; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
button, input, select, textarea { font: inherit; color: inherit; }
button { background: none; border: 0; padding: 0; cursor: pointer; text-align: left; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.app { max-width: 560px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 96px; }

.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); display: flex; align-items: center; gap: 4px; padding-block: 10px; min-height: 64px; }
.top h1 { flex: 1; margin: 0; font-size: 18px; font-weight: 800; text-align: center; }
.iconbtn { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; color: var(--muted); flex: none; }
.iconbtn svg { width: 22px; height: 22px; }
.notice { font-size: 13px; color: var(--muted); background: var(--soft); border-radius: 12px; padding: 8px 12px; margin-bottom: 12px; }

main { display: flex; flex-direction: column; gap: 22px; }
h2 { font-size: 13px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; }
.sechead { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.panel { background: var(--surface); border-radius: 20px; padding: 4px 16px; }
.small { font-size: 13px; color: var(--muted); }
.empty { text-align: center; color: var(--muted); padding: 18px 8px; font-size: 15px; }

.hero { text-align: center; padding-top: 2px; }
.hero .hi { font-size: 30px; font-weight: 900; line-height: 1.15; }
.hero .date { font-size: 15px; font-weight: 700; color: var(--muted); text-transform: capitalize; }
.mood { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.mood button { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 10px 2px 8px; border-radius: 16px; background: var(--surface); font-size: 11px; font-weight: 700; color: var(--muted); }
.mood button span { font-size: 26px; line-height: 1; }
.mood button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
.msg { margin-top: 10px; background: var(--soft); border-radius: 16px; padding: 12px 14px; font-weight: 700; font-size: 15px; }

.item { display: flex; align-items: center; gap: 12px; width: 100%; padding-block: 11px; border-bottom: 1px solid var(--line); min-height: 54px; }
.panel > .item:last-child { border-bottom: 0; }
.item .t { flex: 1; min-width: 0; }
.item .n { font-weight: 700; overflow-wrap: anywhere; }
.item .d { font-size: 13px; color: var(--muted); }
.item .d.late { color: var(--warn); font-weight: 700; }
.item.faded .n { text-decoration: line-through; color: var(--muted); font-weight: 600; }
.item .more { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; color: var(--muted); flex: none; }
.item .more svg { width: 20px; height: 20px; }
.check { flex: none; width: 30px; height: 30px; border-radius: 50%; border: 2px solid color-mix(in srgb, var(--accent) 45%, var(--line)); display: grid; place-items: center; color: transparent; }
.check svg { width: 18px; height: 18px; }
.check.on { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.emo { font-size: 22px; flex: none; width: 30px; text-align: center; }
.pill { font-size: 12px; font-weight: 800; border-radius: 99px; padding: 1px 8px; white-space: nowrap; background: var(--soft); color: var(--muted); }
.pill.warn { color: var(--warn); } .pill.ok { color: var(--good); }

.chips { display: flex; gap: 8px; overflow-x: auto; padding-block: 2px; scrollbar-width: none; margin-inline: -4px; padding-inline: 4px; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; min-height: 38px; padding: 7px 14px; border-radius: 99px; background: var(--surface); font-weight: 700; font-size: 14px; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
.wrapchips { display: flex; flex-wrap: wrap; gap: 8px; }
.sheet .chip { border: 1px solid var(--line); }
.seg { display: flex; background: var(--soft); border-radius: 99px; padding: 3px; }
.seg button { flex: 1; text-align: center; padding: 8px; border-radius: 99px; font-weight: 700; font-size: 14px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); }

.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-top: 14px; text-align: center; font-size: 12px; font-weight: 700; color: var(--muted); }
.week i { display: grid; place-items: center; width: 30px; height: 30px; margin: 0 auto 3px; border-radius: 50%; border: 2px solid var(--line); font-style: normal; font-size: 12px; font-weight: 800; color: var(--muted); }
.week i.l1 { background: color-mix(in srgb, var(--accent) 22%, var(--surface)); border-color: transparent; color: var(--ink); }
.week i.l2 { background: color-mix(in srgb, var(--accent) 55%, var(--surface)); border-color: transparent; color: var(--ink); }
.week i.l3 { background: var(--accent); border-color: transparent; color: var(--on-accent); }
.week .today { color: var(--accent); }

.dayrow { display: grid; grid-template-columns: 74px minmax(0, 1fr); gap: 10px; padding-block: 10px; border-bottom: 1px solid var(--line); align-items: start; }
.panel > .dayrow:last-child { border-bottom: 0; }
.dayrow .dn { font-weight: 800; text-transform: capitalize; padding-top: 6px; }
.dayrow .dn small { display: block; font-size: 12px; color: var(--muted); font-weight: 700; }
.dayrow.today .dn { color: var(--accent); }
.dayrow.past { opacity: .6; }
.slots { display: flex; flex-direction: column; gap: 6px; }
.slot { display: flex; gap: 8px; align-items: baseline; width: 100%; padding: 7px 10px; border-radius: 12px; background: var(--soft); min-height: 36px; }
.slot b { font-size: 12px; color: var(--muted); font-weight: 800; width: 34px; flex: none; }
.slot span { font-weight: 700; overflow-wrap: anywhere; }
.slot span.ph { color: var(--muted); font-weight: 600; }

.qadd { display: flex; gap: 8px; }
.qadd .inp { flex: 1; }
.qadd .go { flex: none; width: 46px; border-radius: 12px; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; }
.qadd .go svg { width: 22px; height: 22px; }

.bookcard { background: var(--surface); border-radius: 20px; padding: 14px 16px; }
.bookcard .bt { font-weight: 800; font-size: 17px; overflow-wrap: anywhere; display: block; width: 100%; }
.bookcard .ba { font-size: 13px; color: var(--muted); }
.bar { height: 10px; border-radius: 5px; background: var(--soft); margin: 10px 0 6px; overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 5px; background: var(--accent); }
.bookfoot { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 13px; color: var(--muted); font-weight: 700; }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.stat { background: var(--surface); border-radius: 18px; padding: 12px; }
.stat strong { display: block; font-size: 22px; font-weight: 900; line-height: 1.15; white-space: nowrap; }
.stat span { font-size: 12px; color: var(--muted); font-weight: 700; }
.bookhead { display: flex; gap: 10px; align-items: flex-start; }
.bookhead .fmt { font-size: 24px; line-height: 1.2; flex: none; }
.bookhead > div { flex: 1; min-width: 0; }
.bookmeta { font-size: 13px; color: var(--muted); margin-top: 2px; }
.bookbtns { display: flex; gap: 8px; margin-top: 12px; }
.bookbtns .btn { flex: 1; padding: 10px; font-size: 15px; border-radius: 14px; }
.timer { margin-top: 12px; background: var(--soft); border-radius: 16px; padding: 12px; text-align: center; }
.timer .tmr { display: block; font-size: 40px; font-weight: 900; font-variant-numeric: tabular-nums; letter-spacing: .02em; line-height: 1.1; }
.timer .tl { font-size: 13px; font-weight: 700; color: var(--muted); }
.timer.paused .tmr { opacity: .5; }
.timer .bookbtns { margin-top: 10px; }
.sess { display: flex; align-items: center; gap: 10px; padding-block: 10px; border-bottom: 1px solid var(--line); }
.panel > .sess:last-child { border-bottom: 0; }
.sess .t { flex: 1; min-width: 0; }
.sess .x { width: 32px; height: 32px; border-radius: 50%; color: var(--muted); text-align: center; font-size: 20px; flex: none; }
.sheet .panel { padding-block: 2px; }
a.item { color: inherit; text-decoration: none; }
.budget { padding-inline: 16px; border-radius: 20px; }
.prog { background: var(--surface); border-radius: 20px; padding: 14px 16px; }
.prog .big { font-size: 34px; font-weight: 900; line-height: 1.1; }
.prog .big small { font-size: 16px; color: var(--muted); font-weight: 800; }
.wknav { display: flex; align-items: center; gap: 4px; }
.wknav strong { flex: 1; text-align: center; font-size: 15px; }
.sp { display: flex; align-items: center; gap: 10px; width: 100%; padding: 6px 0; }
.sp .t { flex: 1; min-width: 0; }
.sp .n { font-weight: 700; }
.sp .d { font-size: 13px; color: var(--muted); }
.sp.todo .n { color: var(--muted); }
.rest { color: var(--muted); font-size: 14px; font-weight: 600; padding-top: 6px; display: flex; justify-content: space-between; align-items: center; }
.addday { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; color: var(--accent); flex: none; }
.addday svg { width: 18px; height: 18px; }
.tplrow { display: grid; grid-template-columns: 52px minmax(0, 1fr) 78px; gap: 8px; align-items: center; margin-bottom: 8px; font-weight: 800; text-transform: capitalize; }
.prompt { font-style: italic; font-weight: 700; color: var(--muted); background: var(--surface); border-radius: 14px; padding: 10px 12px; }
textarea.journal { min-height: 240px; font-weight: 500; }
.jentry .n { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; font-weight: 600; }
.jentry .dt { font-weight: 800; text-transform: capitalize; font-size: 14px; }

.btn { display: block; width: 100%; text-align: center; font-weight: 800; padding: 13px; border-radius: 16px; background: var(--accent); color: var(--on-accent); }
.btn.alt { background: var(--soft); color: var(--ink); }
.btn.sm { display: inline-block; width: auto; padding: 8px 14px; font-size: 14px; border-radius: 99px; }
.btn.danger { background: none; color: var(--bad); }
.btn.danger.sure { background: var(--bad); color: var(--surface); }
.link { color: var(--accent); font-weight: 800; font-size: 14px; }

nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
nav.tabs div { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); }
nav.tabs button { padding: 8px 2px 7px; text-align: center; font-size: 11px; font-weight: 700; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 2px; }
nav.tabs button[aria-current="page"] { color: var(--accent); }
nav.tabs svg { width: 24px; height: 24px; }

.backdrop { position: fixed; inset: 0; z-index: 20; background: rgba(40, 15, 30, .45); display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--bg); width: 100%; max-width: 560px; max-height: 92%; overflow-y: auto; border-radius: 24px 24px 0 0; padding-block: 14px calc(18px + env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 14px; }
.sheethead { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.sheethead h3 { margin: 0; font-size: 18px; font-weight: 800; }
label.f { display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 700; color: var(--muted); }
.inp { width: 100%; min-width: 0; font-size: 16px; font-weight: 600; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
textarea.inp { min-height: 120px; resize: vertical; line-height: 1.5; }
.bignum { display: flex; align-items: baseline; justify-content: center; gap: 8px; background: var(--surface); border-radius: 18px; padding: 8px 14px; }
.bignum input { width: 100%; min-width: 0; text-align: right; font-size: 42px; font-weight: 900; border: 0; background: none; outline: 0; }
.bignum span { font-size: 18px; font-weight: 800; color: var(--muted); white-space: nowrap; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.err { color: var(--bad); font-size: 14px; font-weight: 700; }

.toast { position: fixed; z-index: 30; left: 50%; transform: translateX(-50%); bottom: calc(80px + env(safe-area-inset-bottom, 0px)); width: min(92vw, 420px); background: var(--ink); color: var(--bg); border-radius: 14px; padding: 11px 14px; font-weight: 700; font-size: 14px; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.toast button { font-weight: 900; text-decoration: underline; color: inherit; white-space: nowrap; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

const pad = n => String(n).padStart(2, "0");
const iso = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());

const cap = s => s ? s.charAt(0).toUpperCase() + s.slice(1) : s;

function lsGet(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* stockage indisponible */ } }

/* ---------- État et enregistrement (même file d'attente que Mon Budget) ---------- */
const state = Object.assign(Object.fromEntries(COLS.map(c => [c, {}])), lsGet("vie.data", {}));
const ui = { tab: lsGet("vie.tab", "jour"), moi: lsGet("vie.moi", "lecture"), week: mondayOf(today()), sweek: mondayOf(today()), faire: "taches", newDue: "none" };
if (ui.tab === "lecture") { ui.tab = "moi"; ui.moi = "lecture"; }
let db = null, mode = "loading", queue = lsGet("vie.q", []), flushing = false, stale = false;
const confirmed = {};

function persist() { lsSet("vie.data", state); lsSet("vie.q", queue); }
function applyOp(o) { if (o.data) state[o.col][o.id] = o.data; else delete state[o.col][o.id]; }
function save(col, id, data, quiet) {
  const o = { col, id, data: data || null };
  applyOp(o);
  if (db) { queue = queue.filter(q => !(q.col === col && q.id === id)); queue.push(o); }
  persist(); if (!quiet) render();
  if (db) flush();
}
const withTimeout = (p, ms) => Promise.race([p, new Promise((_, r) => setTimeout(() => r({ code: "unavailable" }), ms))]);
async function flush() {
  if (!db || flushing) return;
  flushing = true;
  while (queue.length) {
    const o = queue[0];
    try {
      const ref = db.collection(o.col).doc(o.id);
      await withTimeout(o.data ? ref.set(o.data) : ref.delete(), 15000);
      if (queue[0] === o) queue.shift();
      lsSet("vie.q", queue);
    } catch (e) {
      const code = e && e.code;
      if (code === "invalid_argument" || code === "quota_exceeded" || code === "revoked" || code === "permission_denied") {
        queue.shift(); lsSet("vie.q", queue);
        toast("Enregistrement refusé. Vérifie que ta session est ouverte.");
        continue;
      }
      break; /* réseau : on réessaie plus tard, rien n'est perdu */
    }
  }
  flushing = false;
  renderNotice();
}
setInterval(() => { if (queue.length) flush(); }, 20000);
addEventListener("online", flush);

const allConfirmed = () => COLS.every(c => confirmed[c]);
function onDocs(col, snap) {
  const map = {};
  snap.docs.forEach(d => { map[d.id] = d.data(); });
  const before = JSON.stringify(state[col]);
  state[col] = map;
  queue.filter(q => q.col === col).forEach(applyOp);
  if (!snap.metadata || !snap.metadata.fromCache) confirmed[col] = true;
  if (allConfirmed()) stale = false;
  persist();
  if (JSON.stringify(state[col]) !== before || mode === "loading") { if (mode === "loading") mode = "db"; render(); } else renderNotice();
}
async function start() {
  render();
  try { db = window.VieBackend ? await VieBackend.ready() : (window.claude && claude.use ? await claude.use("db") : null); } catch (e) { db = null; }
  if (!db) { mode = "local"; render(); return; }
  const timer = setTimeout(() => { if (!allConfirmed()) { stale = true; if (mode === "loading") mode = "db"; render(); } }, 10000);
  const fail = () => { clearTimeout(timer); stale = true; if (mode === "loading") mode = "db"; render(); };
  COLS.forEach(col => db.collection(col).onSnapshot(s => { onDocs(col, s); if (allConfirmed()) clearTimeout(timer); }, fail));
  flush();
}

/* ---------- Données dérivées ---------- */
const list = col => Object.entries(state[col]).map(([id, v]) => ({ id, ...v }));
const dayDoc = d => state.days[d] || {};
function choreDue(c) { return c.last ? addDays(c.last, c.every || 7) : today(); }
function winsCount(d) {
  const w = (dayDoc(d).wins || []).length;
  const t = list("todos").filter(x => x.done && x.doneAt === d).length;
  const c = list("chores").filter(x => (x.hist || []).includes(d)).length;
  return w + t + c;
}
function recipeFor(name) { const n = norm(name); return n ? list("recipes").find(r => norm(r.name) === n) : null; }
function guessRayon(name) {
  const n = norm(name);
  const st = ((state.meta.staples || {}).items || {})[n];
  if (st && st.rayon) return st.rayon;
  for (const [r, words] of GUESS) {
    for (const w of words.split(",")) { if (new RegExp("(^|[^a-z])" + w).test(n)) return r; }
  }
  return "autre";
}
function addGroceries(names) {
  const open = new Set(list("groceries").filter(g => !g.done).map(g => norm(g.name)));
  let n = 0;
  names.forEach(raw => {
    const name = cap(String(raw).trim());
    if (!name || open.has(norm(name))) return;
    open.add(norm(name));
    save("groceries", uid("g"), { name, rayon: guessRayon(name), done: false, ts: Date.now() + n }, true);
    n++;
  });
  render();
  return n;
}
function readingBooks() {
  const tb = timer() && timer().book;
  return list("books").filter(b => b.status === "reading").sort((a, b) => (b.id === tb) - (a.id === tb) || (b.updated || b.ts || 0) - (a.updated || a.ts || 0));
}
/* Lecture : progression en pages ou en %, séances avec durée, chrono partagé entre appareils. */
const isPct = b => b.unit === "pct";
const totalOf = b => isPct(b) ? 100 : (b.pages || 0);
const pctOf = b => totalOf(b) ? Math.min(100, Math.round(100 * (b.page || 0) / totalOf(b))) : 0;
const unitTxt = (b, n) => isPct(b) ? n + " %" : n + " page" + (n > 1 ? "s" : "");
function fmtMin(m) { m = Math.round(m || 0); if (m < 60) return m + " min"; const h = Math.floor(m / 60), r = m % 60; return h + " h" + (r ? " " + pad(r) : ""); }
const timer = () => state.meta.timer && state.meta.timer.book ? state.meta.timer : null;
function elapsedMs(t) { return Math.max(0, (t.pausedAt || Date.now()) - t.startedAt - (t.pausedMs || 0)); }
function clock(ms) { const s = Math.floor(ms / 1000), h = Math.floor(s / 3600), m = Math.floor(s / 60) % 60; return (h ? h + ":" + pad(m) : m) + ":" + pad(s % 60); }
const dec = n => (Math.round(n * 10) / 10).toLocaleString("fr-FR");
const speedTxt = (b, perMin) => isPct(b) ? dec(perMin * 60) + " %/h" : dec(perMin) + " page" + (perMin >= 2 ? "s" : "") + "/min";
const sessionsOf = id => list("sessions").filter(s => s.book === id).sort((a, b) => (b.ts || 0) - (a.ts || 0));
function bookStats(b) {
  const ss = sessionsOf(b.id), minutes = ss.reduce((a, s) => a + (s.minutes || 0), 0);
  const timed = ss.filter(s => s.minutes > 0 && s.to > s.from);
  const tMin = timed.reduce((a, s) => a + s.minutes, 0), tUnits = timed.reduce((a, s) => a + (s.to - s.from), 0);
  const speed = tMin >= 1 && tUnits > 0 ? tUnits / tMin : null; /* unités par minute */
  const left = speed && totalOf(b) ? Math.max(0, totalOf(b) - (b.page || 0)) / speed : null;
  return { ss, minutes, speed, left };
}

  const h = new Date().getHours();

  out += '</section>';

function dueFor(k) {
  const d = today();
  if (k === "today") return d;
  if (k === "tomorrow") return addDays(d, 1);
  if (k === "weekend") { const dow = P(d).getDay(); return dow === 6 || dow === 0 ? d : addDays(d, 6 - dow); }
  return null;
}
function viewTaches() {
  const d = today(), all = list("todos"), open = all.filter(t => !t.done);
  const opts = [["none", "Un jour"], ["today", "Aujourd'hui"], ["tomorrow", "Demain"], ["weekend", "Ce week-end"]];
  let out = '<section><div class="qadd"><input class="inp" id="tq" placeholder="Nouvelle chose à faire…" enterkeyhint="done" autocomplete="off" data-enter="t-add"><button class="go" data-act="t-add" aria-label="Ajouter">' + PLUS + '</button></div>' +

  groups.forEach(([title, g]) => {

    out += '<section><h2>' + title + '</h2><div class="panel">' + g.sort((a, b) => (a.due || "").localeCompare(b.due || "") || a.ts - b.ts).map(t => todoItem(t, d)).join("") + '</div></section>';
  });
  const recent = all.filter(t => t.done && t.doneAt && diff(t.doneAt, d) <= 7).sort((a, b) => (b.doneTs || 0) - (a.doneTs || 0)).slice(0, 8);
  if (recent.length) out += '<section><h2>Fait cette semaine 💪</h2><div class="panel">' + recent.map(t => todoItem(t, d)).join("") + '</div></section>';

function todoItem(t, d) {
  let sub = "";
  if (t.done) sub = "Fait " + relPast(diff(t.doneAt, d));
  else if (t.due && t.due < d) sub = "Prévu le " + dShort(t.due);
  else if (t.due && t.due > addDays(d, 1)) sub = cap(fmt(t.due, { weekday: "long", day: "numeric", month: "short" }));
  return '<div class="item' + (t.done ? " faded" : "") + '">' + checkBtn("todo-done", t.id, t.done, (t.done ? "Remettre à faire : " : "Marquer comme fait : ") + t.name) + '<button class="t" data-act="todo" data-id="' + esc(t.id) + '"><div class="n">' + esc(t.name) + '</div>' + (sub ? '<div class="d' + (!t.done && t.due && t.due < d ? " late" : "") + '">' + esc(sub) + '</div>' : '') + '</button></div>';
}

function toggleWin(d, id) {
  const doc = dayDoc(d), wins = doc.wins || [];
  save("days", d, { ...doc, wins: wins.includes(id) ? wins.filter(w => w !== id) : [...wins, id] });
}
function choreToggle(id) {
  const c = state.chores[id]; if (!c) return;
  const d = today();
  if (c.last === d) {
    const hist = (c.hist || []).filter(x => x !== d);
    save("chores", id, { ...c, hist, last: hist.length ? hist[hist.length - 1] : null });
  } else {
    const prev = { ...c };
    save("chores", id, { ...c, last: d, hist: [...(c.hist || []).filter(x => x !== d), d].slice(-12) });
    toast("« " + c.name + " » fait ✨", "Annuler", () => save("chores", id, prev));
  }
}
function todoToggle(id) {
  const t = state.todos[id]; if (!t) return;
  if (t.done) { save("todos", id, { ...t, done: false, doneAt: null, doneTs: null }); return; }
  const prev = { ...t };
  save("todos", id, { ...t, done: true, doneAt: today(), doneTs: Date.now() });
  toast("Bien joué 💪", "Annuler", () => save("todos", id, prev));
}

    el.focus();
  },
  todo(b) { sheetTodo(b.dataset.id); },
  "todo-save"(b) { const t = state.todos[b.dataset.id]; if (t) save("todos", b.dataset.id, { ...t, name: $("tn").value.trim() || t.name, due: $("td").value || null }); closeSheet(); },
  "todo-del"(b) { save("todos", b.dataset.id, null); closeSheet(); },
  "chore-new"() { sheetChore(null); },
  chore(b) { sheetChore(b.dataset.id); },
  "chore-save"(b) {
    const name = $("cn").value.trim(); if (!name) { $("cerr").textContent = "Donne un nom à la tâche."; return; }
    const every = +(picked("cf") || 7), last = $("cl").value || null;
    const id = b.dataset.id || uid("c"), old = state.chores[id] || {};
    let hist = old.hist || [];
    if (last && !hist.includes(last)) hist = [...hist, last].sort().slice(-12);
    save("chores", id, { ...old, name, every, last, hist, ts: old.ts || Date.now() }); closeSheet();
  },
  "chore-del"(b) { save("chores", b.dataset.id, null); closeSheet(); },
  "chore-base"() {
    /* Étalées dans le temps pour ne pas tout avoir « à faire » le même jour. */
    const d = today();
    BASE_CHORES.forEach(([name, every], i) => {
      const offset = every === 1 ? 0 : (i % (every - 1)) + 1;
      save("chores", uid("c"), { name, every, last: addDays(d, offset - every), hist: [], ts: Date.now() + i }, true);
    });
    render();
    toast("Liste ajoutée. Modifie ou supprime ce qui ne te correspond pas.");
  },

  "book-new"() { sheetBook(null); },
  book(b) { sheetBook(b.dataset.id); },
  "book-save"(b) {
    const title = $("bt").value.trim(); if (!title) { $("berr").textContent = "Donne le titre du livre."; return; }
    const unit = picked("bu") || "pages", format = picked("bf") || "papier", status = picked("bs") || "reading";
    const pages = unit === "pct" ? null : intOf($("bp").value);
    const page = unit === "pct" ? Math.min(100, intOf($("bcp").value) || 0) : (intOf($("bc").value) || 0);
    const id = b.dataset.id || uid("b"), old = state.books[id] || {};
    const doc = { ...old, title, author: $("ba").value.trim(), format, unit, pages, page, status, ts: old.ts || Date.now(), updated: Date.now() };
    if (status === "reading" && !doc.started) doc.started = today();
    if (status === "done" && !doc.finished) { doc.finished = today(); if (totalOf(doc)) doc.page = totalOf(doc); }
    if (status !== "done") doc.finished = null;
    save("books", id, doc); closeSheet();
  },
  "book-del"(b) { save("books", b.dataset.id, null); closeSheet(); },
  "book-start"(b) { const bk = state.books[b.dataset.id]; if (bk) save("books", b.dataset.id, { ...bk, status: "reading", started: today(), updated: Date.now() }); },
  read(b) { sheetRead(b.dataset.id); },
  "read-plus"(b) { const el = $("rp"); el.value = (intOf(el.value) || 0) + +b.dataset.n; },
  "read-min"(b) { $("rmin").value = b.dataset.n; },
  "read-save"() {
    const id = $("sheet").querySelector('[data-act="read-save"][data-id]').dataset.id, bk = state.books[id];
    if (!bk) return closeSheet();
    const v = intOf($("rp").value), mins = intOf($("rmin").value) || 0, mode = picked("rm") || "at";
    if (v == null) { $("rerr").textContent = mode === "read" ? "Écris le nombre de pages lues." : "Écris où tu en es."; return; }
    const from = bk.page || 0, tot = totalOf(bk);
    let page = mode === "read" ? from + v : v;
    if (tot) page = Math.min(page, tot);
    const d = ($("rdate") && $("rdate").value) || today(), delta = page - from;
    const doc = { ...bk, page, updated: Date.now() };
    const finished = tot && page >= tot;
    if (finished) { doc.status = "done"; doc.finished = d; }
    save("books", id, doc, true);
    if (delta > 0 || mins > 0) save("sessions", uid("s"), { book: id, date: d, from, to: page, minutes: mins, unit: isPct(bk) ? "pct" : "pages", ts: Date.now() }, true);
    const t = timer(); if (t && t.book === id && $("sheet").dataset.fromTimer) save("meta", "timer", null, true);
    if ((delta > 0 || mins > 0) && !(dayDoc(d).wins || []).includes("read")) toggleWin(d, "read"); else render();
    closeSheet();
    if (finished) toast("Livre terminé, bravo ! 🎉");
    else if (delta > 0 && mins > 0) {
      const st = bookStats({ ...doc, id });
      toast(unitTxt(bk, delta) + " en " + fmtMin(mins) + " (" + speedTxt(bk, delta / mins) + ")" + (st.left != null ? " · encore ≈ " + fmtMin(st.left) : "") + " 📖");
    } else toast([delta > 0 ? "+" + unitTxt(bk, delta) : "", mins ? fmtMin(mins) : ""].filter(Boolean).join(" · ") + (delta > 0 || mins ? " 📖" : "Progression enregistrée"));
  },
  "sess-del"(b) {
    if (!b.classList.contains("sure")) { b.classList.add("sure"); b.textContent = "✓"; b.setAttribute("aria-label", "Confirmer la suppression"); return; }
    const s = state.sessions[b.dataset.id]; if (!s) return;
    save("sessions", b.dataset.id, null);
    b.closest(".sess").remove();
    toast("Séance supprimée", "Annuler", () => save("sessions", b.dataset.id, s));
  },
  "timer-start"(b) { save("meta", "timer", { book: b.dataset.id, startedAt: Date.now(), pausedMs: 0, pausedAt: null }); },
  "timer-pause"() { const t = timer(); if (t && !t.pausedAt) save("meta", "timer", { ...t, pausedAt: Date.now() }); },
  "timer-resume"() { const t = timer(); if (t && t.pausedAt) save("meta", "timer", { ...t, pausedMs: (t.pausedMs || 0) + Date.now() - t.pausedAt, pausedAt: null }); },
  "timer-stop"() {
    const t = timer(); if (!t) return;
    if (!t.pausedAt) save("meta", "timer", { ...t, pausedAt: Date.now() }, true);
    sheetRead(t.book, Math.max(1, Math.round(elapsedMs(timer()) / 60000)));
    render();
  },
  "timer-cancel"(b) {
    if (!b.classList.contains("sure")) { b.classList.add("sure"); b.textContent = "Appuie encore pour annuler le chrono"; return; }
    save("meta", "timer", null);
  }
};
Object.assign(ACTS, ACTS_EXTRA);
function rememberStaples(items, inc) {
  const cur = (state.meta.staples || {}).items || {}, next = { ...cur };
  items.forEach(g => { const k = norm(g.name); if (!k) return; const o = next[k] || { name: g.name, n: 0 }; next[k] = { name: o.name, rayon: g.rayon || o.rayon || "autre", n: (o.n || 0) + inc }; });
  save("meta", "staples", { items: next }, true);
}

document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const act = b.dataset.act;
  if (act === "close-bg") { if (e.target === b) closeSheet(); return; }
  if (b.classList.contains("danger") && !b.classList.contains("sure")) { b.classList.add("sure"); b.textContent = "Appuie encore pour confirmer"; return; }
  if (ACTS[act]) ACTS[act](b);
});
document.addEventListener("change", e => {
  if (e.target.dataset && e.target.dataset.actChange === "journal-date" && e.target.value) sheetJournal(e.target.value);
});
document.addEventListener("input", e => {
  if (!e.target.closest || !e.target.closest("[data-autosave]")) return;
  clearTimeout(jTimer); $("jstat").textContent = "…";
  jTimer = setTimeout(() => { jTimer = null; saveJournal(true); }, 900);
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && $("sheet").innerHTML) { closeSheet(); return; }
  if (e.key !== "Enter" || e.isComposing) return;
  const el = e.target.closest && e.target.closest("[data-enter]"); if (!el) return;
  e.preventDefault();
  const act = el.dataset.enter, btn = document.querySelector('[data-act="' + act + '"][data-id], [data-act="' + act + '"]');
  ACTS[act](btn || el);
});

let toastTimer = null;
function toast(msg, label, fn) {
  clearTimeout(toastTimer);
  $("toast").innerHTML = '<div class="toast"><span>' + esc(msg) + '</span>' + (label ? '<button id="toastbtn">' + esc(label) + '</button>' : '') + '</div>';
  if (label) $("toastbtn").onclick = () => { $("toast").innerHTML = ""; fn(); };
  toastTimer = setTimeout(() => { $("toast").innerHTML = ""; }, label ? 6000 : 3000);
}
/* Passage à minuit pendant que l'appli est ouverte. */
setInterval(() => { const t = timer(); if (t) document.querySelectorAll(".tmr").forEach(e => { e.textContent = clock(elapsedMs(t)); }); }, 1000);
let lastDay = today();
setInterval(() => { if (today() !== lastDay) { lastDay = today(); render(); } }, 60000);
document.addEventListener("visibilitychange", () => { if (!document.hidden && today() !== lastDay) { lastDay = today(); render(); } });

start();
</script>

</body>
